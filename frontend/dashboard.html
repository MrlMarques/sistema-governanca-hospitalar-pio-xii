<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Executivo • Hospital Pio XII</title>
    <style>
        :root { --bordo: #9A2B2E; --bordo-escuro: #6E1B1E; --bg-page: #F1F5F9; --card-bg: #FFFFFF; --border: #E2E8F0; --text-main: #0F172A; --verde: #15803D; --vermelho: #B91C1C; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-page); color: var(--text-main); padding-bottom: 32px; }
        .header { background: linear-gradient(135deg, var(--bordo) 0%, var(--bordo-escuro) 100%); color: #FFFFFF; padding: 16px; }
        .header-inner { max-width: 920px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 920px; margin: 0 auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 16px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media(min-width:680px) { .kpi-grid { grid-template-columns: repeat(4, 1fr); } }
        .kpi-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
        .kpi-card span { font-size: 0.68rem; text-transform: uppercase; font-weight: 800; color: #64748B; }
        .kpi-card strong { display: block; font-size: 1.55rem; font-weight: 900; margin-top: 4px; }
        .section-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .pareto-row { display: flex; flex-direction: column; gap: 4px; }
        .pareto-top { display: flex; justify-content: space-between; font-size: 0.82rem; font-weight: 700; }
        .pareto-track { width: 100%; height: 8px; background: #E2E8F0; border-radius: 99px; overflow: hidden; }
        .pareto-fill { height: 100%; background: var(--vermelho); border-radius: 99px; }
        .hist-item { border: 1px solid var(--border); border-left: 5px solid var(--verde); border-radius: 10px; padding: 12px; background: #F8FAFC; display: flex; flex-direction: column; gap: 5px; }
        .hist-item.has-fail { border-left-color: var(--vermelho); background: #FEF2F2; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div><h1>📊 Dashboard Executivo</h1><span id="subStatus">Carregando...</span></div>
            <button type="button" onclick="carregarDashboard()" style="background:rgba(255,255,255,0.2); border:none; color:#fff; padding:8px 12px; border-radius:8px; font-weight:700; cursor:pointer;">🔄 Atualizar</button>
        </div>
    </header>
    <main class="container">
        <div class="kpi-grid">
            <div class="kpi-card"><span>Conformidade Global</span><strong id="kpiGlobal" style="color:var(--verde);">--%</strong></div>
            <div class="kpi-card"><span>Total Inspeções</span><strong id="kpiTotal">0</strong></div>
            <div class="kpi-card"><span>Limpeza Terminal</span><strong id="kpiTerminal" style="color:var(--azul);">--%</strong></div>
            <div class="kpi-card"><span>Concorrente</span><strong id="kpiConcorrente" style="color:var(--bordo);">--%</strong></div>
        </div>
        <section class="section-card">
            <h2>🚨 Ranking de Itens Críticos (Ofensores)</h2>
            <div id="listaOfensores" style="display:flex; flex-direction:column; gap:10px;"><div style="font-size:0.84rem; color:#64748B;">Carregando Pareto...</div></div>
        </section>
        <section class="section-card">
            <h2>📋 Histórico Recente</h2>
            <div id="listaHistorico" style="display:flex; flex-direction:column; gap:9px;"></div>
        </section>
    </main>
    <script>
        let historicoCache = [];
        function carregarDashboard() {
            google.script.run.withSuccessHandler(data => {
                if (!data) return;
                document.getElementById('kpiGlobal').textContent = Number(data.taxaConformidade || 0).toFixed(1) + '%';
                document.getElementById('kpiTotal').textContent = data.totalInspecoes || 0;
                document.getElementById('kpiTerminal').textContent = Number(data.taxaTerminal || 0).toFixed(1) + '%';
                document.getElementById('kpiConcorrente').textContent = Number(data.taxaConcorrente || 0).toFixed(1) + '%';
                
                const ofensores = (data.itensDetalhados || []).filter(i => i.nconf > 0).sort((a,b) => b.nconf - a.nconf).slice(0,6);
                const maxFalhas = ofensores[0]?.nconf || 1;
                document.getElementById('listaOfensores').innerHTML = ofensores.length ? ofensores.map(i => `
                    <div class="pareto-row">
                        <div class="pareto-top"><span>${i.nome} (${i.ambiente})</span><span style="color:var(--vermelho);">${i.nconf} falha(s)</span></div>
                        <div class="pareto-track"><div class="pareto-fill" style="width:${Math.round((i.nconf/maxFalhas)*100)}%;"></div></div>
                    </div>
                `).join('') : '<div style="color:var(--verde); font-weight:700;">✔ Sem falhas registradas.</div>';
                
                historicoCache = data.historico || [];
                renderizarHistorico();
                document.getElementById('subStatus').textContent = 'Atualizado com sucesso';
            }).obterDadosDashboard();
        }
        function renderizarHistorico() {
            document.getElementById('listaHistorico').innerHTML = historicoCache.slice(0,25).map(h => `
                <div class="hist-item ${h.naoConformes > 0 ? 'has-fail' : ''}">
                    <div style="display:flex; justify-content:space-between; font-weight:800;"><span>🏥 ${h.setor} • Leito ${h.leito} (${h.tipo})</span><span style="color:${h.naoConformes > 0 ? 'var(--vermelho)' : 'var(--verde)'};">${h.naoConformes > 0 ? h.naoConformes + ' Falha(s)' : '100% OK'}</span></div>
                    <div style="font-size:0.76rem; color:#64748B;">Protocolo: ${h.id} • Auditora: ${h.auditora} • ${h.dataHora}</div>
                    ${h.naoConformes > 0 ? '<div style="font-size:0.8rem; color:var(--vermelho); font-weight:700;">Itens: ' + h.falhas + '</div>' : ''}
                </div>
            `).join('');
        }
        window.addEventListener('DOMContentLoaded', carregarDashboard);
    </script>
</body>
</html>
